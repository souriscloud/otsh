# fail2ban filter for the otsh audit log.
#
# Install as /etc/fail2ban/filter.d/otsh.conf and enable it with the jail in
# deploy/fail2ban/jail.d/otsh.local. Requires Config.audit to be set in your
# app (ssh.audit_stderr is the ready-made sink) — with it nil, which is the
# default, otsh logs nothing and this filter has nothing to read.
#
# The regexes below are written against the line-format contract documented in
# ssh/audit.odin and docs/ssh.md#audit. That grammar is a contract precisely so
# that filters like this one can be written against it; if it ever changes,
# this file changes with it.
#
# What is matched, and why each one is a failure:
#
#   event=auth ... ok=false   one refused authentication attempt. Fires for
#                             every refusal, including a method the server does
#                             not offer and an attempt past max_auth_attempts.
#   event=reject              Limits refused the connection before any crypto —
#                             max_sessions or max_per_ip was already full.
#   event=kex_fail            key exchange failed; there is no client identity
#                             yet, so the address is all there is to go on.
#
# Deliberately NOT matched: listen, accept, session_start, session_end, and
# auth with ok=true. An accept is not a failure, and banning on it would ban
# every user.
#
# Sample lines, lifted verbatim from the real capture in docs/ssh.md#audit.
# Only the third line here is a match (method=none ok=false):
#
#   otsh: audit ts=2026-07-29T19:34:20Z event=listen host=0.0.0.0 port=2229
#   otsh: audit ts=2026-07-29T19:34:21Z event=accept addr=127.0.0.1
#   otsh: audit ts=2026-07-29T19:34:21Z event=auth addr=127.0.0.1 method=none user=souris ok=false
#   otsh: audit ts=2026-07-29T19:34:21Z event=auth addr=127.0.0.1 method=publickey user=souris ok=true id=8550aab27bd698618495ca868215c5b7
#   otsh: audit ts=2026-07-29T19:34:21Z event=session_start addr=127.0.0.1 user=souris term=xterm-ghostty cols=120 rows=40 id=8550aab27bd698618495ca868215c5b7
#   otsh: audit ts=2026-07-29T19:34:24Z event=session_end addr=127.0.0.1 secs=3.412 id=8550aab27bd698618495ca868215c5b7
#
# And the two failure events, which that capture does not contain (they are
# constructed from the field order in the contract):
#
#   otsh: audit ts=2026-07-29T19:34:25Z event=reject addr=203.0.113.9 limit=per_ip
#   otsh: audit ts=2026-07-29T19:34:26Z event=kex_fail addr=2001:db8::dead
#
# Note the first capture line above: an OpenSSH client always tries the "none"
# method first, so a publickey-only server logs one `method=none ok=false` per
# honest connection. That is real, it is not an attack, and it is the single
# most important thing to know when picking maxretry — see the jail file. If it
# bothers you, swap in the alt-failregex below, which ignores method=none at
# the cost of no longer seeing a client hammering a method you do not offer.
#
# alt-failregex: ^(?:.*?\s)?otsh: audit ts=\S*\s+event=auth addr=<HOST> method=(?!none\b)\S+ user=\S+ ok=false(?: id=\S+)?\s*$
#
# The regexes use no %(...)s interpolation and include no other filter file, so
# what you read here is exactly what fail2ban compiles. Verified against a real
# fail2ban-regex 1.1.0: on a 13-line corpus (the capture above plus prefixed,
# IPv6 and forged-field variants) it matches exactly the 7 failure lines and
# misses the 6 benign ones, extracting the addr= value every time. Re-verify
# anywhere fail2ban is installed, or approximate without one:
#
#   fail2ban-regex /var/log/otsh.log /etc/fail2ban/filter.d/otsh.conf
#   python3 deploy/fail2ban/test_filter.py     # no fail2ban install needed
#
# Structure of each regex, left to right:
#
#   ^(?:.*?\s)?     an optional log prefix. The systemd backend hands fail2ban
#                   "<host> <ident>[<pid>]: <message>", a plain file has no
#                   prefix at all, and a syslog file has yet another. Non-greedy
#                   so it stops at the first "otsh: audit".
#   otsh: audit     the literal every line begins with, by contract.
#   ts=\S*\s+       the timestamp SLOT, not the timestamp. Before failregex
#                   runs, fail2ban locates the line's date and excises that
#                   text: our "ts=2026-01-02T03:04:05Z event=…" reaches the
#                   regex as "ts= event=…" (the trailing Z is consumed as a
#                   zone offset). But when a syslog prefix carries its own
#                   date at line start, that one is excised instead and ours
#                   survives intact. \S*\s+ accepts both shapes. Writing the
#                   timestamp literally here is the natural mistake — it
#                   matches nothing under a real fail2ban, silently. Found
#                   empirically with fail2ban-regex 1.1.0.
#   event=<name>    the discriminator.
#   addr=<HOST>     <HOST> lands here and nowhere else, because the fields are
#                   in a fixed order and every value is scrubbed to
#                   [A-Za-z0-9.:_@/+,%-] with everything else becoming '?'. A
#                   client-supplied user or term therefore cannot contain a
#                   space or an '=', so it cannot introduce a second addr= and
#                   shift the extracted address. The scrub is load-bearing for
#                   this filter.
#   ...\s*$         anchored at the end against the exact remaining fields for
#                   that event, so a partial or forged tail does not match. If
#                   your log pipeline appends a suffix to each line, this is the
#                   anchor to relax.

[Definition]

failregex = ^(?:.*?\s)?otsh: audit ts=\S*\s+event=auth addr=<HOST> method=\S+ user=\S+ ok=false(?: id=\S+)?\s*$
            ^(?:.*?\s)?otsh: audit ts=\S*\s+event=reject addr=<HOST> limit=\S+\s*$
            ^(?:.*?\s)?otsh: audit ts=\S*\s+event=kex_fail addr=<HOST>\s*$

ignoreregex =

# No datepattern, on purpose. fail2ban's default detectors recognise the RFC
# 3339 ts= value — and a syslog prefix's own date — without help, and the
# systemd backend ignores file-side dates entirely in favour of the journal's.
# An explicit `ts=%%Y-%%m-%%dT%%H:%%M:%%SZ` pattern was tried and produced zero
# date hits under fail2ban-regex 1.1.0; the defaults are what is verified.

# IPv6: <HOST> only matches addresses containing colons on fail2ban 0.10 and
# newer. On 0.9 an IPv6 audit line simply does not match — no ban, no error, no
# log entry saying so. Check with `fail2ban-client version` before assuming
# your v6 listener is covered.
