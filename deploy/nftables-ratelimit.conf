#!/usr/sbin/nft -f
#
# Kernel-level rate limiting for an otsh port. This is the layer that runs in
# front of the process — before accept(), before a thread is created, before
# libssh sees a byte. It is the only layer that costs nothing per dropped
# packet, and the only one that still works when the process is saturated.
#
#   nft -c -f deploy/nftables-ratelimit.conf   # check syntax, change nothing
#   nft -f deploy/nftables-ratelimit.conf      # load
#   nft list table inet otsh                   # inspect, with counters
#
# To make it survive a reboot, include this file from /etc/nftables.conf or
# install it as /etc/nftables.d/otsh.conf, depending on your distribution.
#
# pf equivalents for the BSDs and macOS are at the bottom of this file, in
# comments — this file itself is nftables syntax only and loads as-is.
#
# What this does NOT do: stop a distributed flood. Per-source limits are
# per-source; ten thousand addresses sending one connection each defeat every
# rule below exactly as they defeat otsh's own Limits. See docs/deploy.md.
#
# Every rule below exists twice, once for `ip saddr` and once for `ip6 saddr`,
# over paired ipv4_addr/ipv6_addr sets. That is not decoration: ssh.DEFAULT_HOST
# is the IPv6 wildcard "::", so an otsh server answers IPv6 clients unless the
# app set Config.host itself, and an `ip`-only rule does not see one packet of
# that traffic. Keep the pairs together when you edit this.

# APP-SPECIFIC: the port your otsh app listens on (examples/tracker uses 2222).
define OTSH_PORT = 2222

# Per-source ceilings. Deliberately aligned with ssh.DEFAULT_LIMITS
# (ssh/limits.odin) so the kernel refuses roughly what otsh would have refused,
# but without spending a thread and a Session on it first:
#   max_per_ip = 8  ->  OTSH_MAX_CONN = 8
# Documentation only: the two `ct count over 8` rules below must repeat the
# number literally, because nft does not accept a variable in that position.
define OTSH_MAX_CONN = 8

# Declare-then-delete: makes the file idempotent, so re-loading it replaces the
# table instead of appending a second copy of every rule. The bare `table` line
# creates it if it does not exist, so the `delete` never fails on a fresh boot.
table inet otsh
delete table inet otsh

table inet otsh {
	# Manually banned sources, with a one hour expiry. This is the "banned
	# tier": add to it from a script, from an alert, or by hand.
	#   nft add element inet otsh banned4 { 203.0.113.9 }
	#   nft add element inet otsh banned6 { 2001:db8::dead }
	#   nft list set inet otsh banned4
	# fail2ban keeps its own bans in its own table (inet f2b-table); this set
	# is for the bans you decide on, and it is unaffected by
	# `fail2ban-client unban --all`.
	set banned4 {
		type ipv4_addr
		flags timeout
		timeout 1h
		comment "operator-banned IPv4 sources"
	}

	set banned6 {
		type ipv6_addr
		flags timeout
		timeout 1h
		comment "operator-banned IPv6 sources"
	}

	# Dynamic sets holding one rate-limiter per source address. `flags dynamic`
	# lets a rule create elements; the timeout reclaims an address that has
	# gone quiet, and `size` caps the memory a spray of distinct sources can
	# make the kernel spend — this is the one place a distributed flood can
	# still cost you something, so bound it explicitly.
	set conn_rate4 {
		type ipv4_addr
		flags dynamic,timeout
		timeout 1m
		size 65535
	}

	set conn_rate6 {
		type ipv6_addr
		flags dynamic,timeout
		timeout 1m
		size 65535
	}

	# Concurrent-connection counters, the kernel-side mirror of max_per_ip.
	set conn_count4 {
		type ipv4_addr
		flags dynamic
		size 65535
	}

	set conn_count6 {
		type ipv6_addr
		flags dynamic
		size 65535
	}

	chain input {
		# Priority -10 puts this ahead of a conventional filter table at
		# priority 0, so a packet is dropped here before that table can accept
		# it. policy accept: this table only ever removes traffic, it is not
		# your firewall.
		type filter hook input priority -10; policy accept;

		# Everything below concerns new inbound connections to one port.
		# Established traffic and every other port fall straight through.
		tcp dport $OTSH_PORT ct state new jump otsh_new
	}

	chain otsh_new {
		# 1. Banned sources: nothing else applies to them.
		ip  saddr @banned4 counter drop
		ip6 saddr @banned6 counter drop

		# 2. Per-source connection rate. `add @set { ... limit rate over ... }`
		#    creates or updates that source's limiter and matches only when it
		#    is exceeded. 10 new connections a minute, with a burst of 5 so a
		#    reconnect storm from one honest client is absorbed rather than
		#    punished.
		add @conn_rate4 { ip  saddr limit rate over 10/minute burst 5 packets } counter drop
		add @conn_rate6 { ip6 saddr limit rate over 10/minute burst 5 packets } counter drop

		# 3. Concurrent connections per source, mirroring max_per_ip. reject
		#    rather than drop: this one fires against legitimate users who
		#    opened one window too many, and a refusal they see beats a hang.
		#    The 8 is a literal, not $OTSH_MAX_CONN: nft accepts only a plain
		#    number after `ct count over` (a define here is a syntax error,
		#    found by `nft -c`). Change it together with the define above.
		add @conn_count4 { ip  saddr ct count over 8 } counter reject with tcp reset
		add @conn_count6 { ip6 saddr ct count over 8 } counter reject with tcp reset

		# 4. Aggregate ceiling across all sources. This is the only rule here
		#    that a distributed flood trips, and it is indiscriminate by
		#    nature: past this rate, new connections are dropped without regard
		#    for who sent them, including real users. That is the trade — a
		#    server that refuses some new connections beats one that has run
		#    out of threads. Size it above your real peak; 100/minute with a
		#    burst of 50 suits a small service and is far too tight for a busy
		#    one.
		limit rate over 100/minute burst 50 packets counter drop

		# Anything that reaches here is a new connection within every limit.
		# Left to the chain policy (accept) rather than accepted explicitly, so
		# your real firewall still gets its say.
	}
}

# =============================================================================
# pf equivalent — FreeBSD, OpenBSD, macOS. NOT nftables syntax; do not feed
# this file to pf. Copy the block below into /etc/pf.conf (FreeBSD/OpenBSD) or
# an anchor file under /etc/pf.anchors/ (macOS), and reload with
# `pfctl -f /etc/pf.conf`. Check first with `pfctl -nf /etc/pf.conf`.
# =============================================================================
#
#   otsh_port = "2222"
#   otsh_if   = "em0"          # the real interface; `egress` is OpenBSD-only
#
#   # The banned tier. `persist` keeps the table when no rule references it.
#   table <otsh_banned> persist
#
#   block drop in quick proto tcp from <otsh_banned>
#
#   # max-src-conn      concurrent connections per source  (= max_per_ip = 8)
#   # max-src-conn-rate new connections per source per 60s (= 10/minute)
#   # overload          offenders land in the table above, which the block rule
#   #                   already covers
#   # flush global      kill the offender's existing states too, not just the
#   #                   connection that tripped the rule
#   pass in on $otsh_if proto tcp to port $otsh_port \
#       flags S/SA keep state \
#       (max-src-conn 8, max-src-conn-rate 10/60, \
#        overload <otsh_banned> flush global)
#
#   # Aggregate ceiling, the pf counterpart of rule 4 above: at most 512
#   # simultaneous states for this service, whoever they belong to.
#   #   ... keep state (max 512, max-src-conn 8, max-src-conn-rate 10/60, ...)
#
# Expiring bans: pf has no per-entry timeout. Age the table from cron, e.g.
# hourly `pfctl -t otsh_banned -T expire 3600`. Without that, a ban is
# permanent until the table is flushed — a real difference from the nftables
# sets above, and the usual way an operator locks out a customer for a month.
#
# macOS specifics: pf is present but not enabled by default (`pfctl -e`), the
# ruleset is driven from /etc/pf.conf via anchors, and both are reset by system
# updates. Treat a macOS box as a development target, not somewhere these
# limits will still be in place next quarter.
