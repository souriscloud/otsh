name: ci

# Cost shapes this file. On a PRIVATE repo, GitHub bills macOS runner minutes
# at 10x and Windows at 2x against the monthly allowance, and each job is
# rounded up to a whole minute. Measured on the first real run: windows 17m
# wall = 34 billed, macOS 54s = 10 billed, ubuntu 1m10s = 2, docs 6s = 1 —
# 47 minutes for one push, or about 42 pushes a month before it costs money.
#
# So the cheap jobs (Linux, docs) run on every push and pull request, and the
# expensive ones run when there is a reason: on demand, weekly, and for
# release tags. Routine pushes now cost ~3 billed minutes instead of 47.
# Nothing about coverage changes — the same jobs run, just not on every commit.
#
# The repository has since gone public, which makes Actions minutes free on
# hosted runners. The gating stays anyway: the reasoning was never only money
# — a 17-minute Windows job on every push is feedback nobody reads, the
# billed-minute numbers above stay true if the repo ever goes private again,
# and "runs when there is a reason" is the right shape regardless of price.
# What being public did change is the `release` job at the bottom: four
# runners per tag is affordable now, and a tag is exactly a reason.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    # Mondays 04:17 UTC. Odd minute on purpose: the top of the hour is when
    # everyone else's cron fires and the runner queue is longest.
    - cron: '17 4 * * 1'
  workflow_dispatch:

# Nothing here writes to the repository: the jobs check out, build, test and
# validate the docs. The one place GITHUB_TOKEN is used is setup-odin, which
# needs it to read a release asset off the Odin repository — a read, and
# `contents: read` already covers it. Stating the scope explicitly means the
# job token stays read-only no matter what the repository's or organisation's
# default workflow permissions are set to.
permissions:
  contents: read

# The pinned Odin. Every blocking job builds against this exact tagged release
# and nothing else, so a breaking change upstream cannot turn CI red on its own
# schedule. dev-2026-07a is the compiler behind every claim in
# docs/compatibility.md: the Linux container runs, the Windows 11 hardware run
# on 2026-07-31, and the machine this package is developed on all report
# `dev-2026-07-nightly:819fdc7`, which is what that release contains.
#
# Moving this pin is a deliberate act with a checklist — see the "upgrading a
# dependency" section of docs/compatibility.md. The `odin-master` job below
# exists so that moving it is never a surprise.
env:
  ODIN_RELEASE: dev-2026-07a

jobs:
  # Linux carries every push: it is the 1x platform, it runs the full test
  # suite, and it owns both cross-type-checks, so a Windows or FreeBSD
  # regression is caught here without paying for those runners.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # clang is listed on purpose even though the ubuntu-latest runner image
      # already has it: Odin shells out to `clang` to link on Linux, and on a
      # stock ubuntu:24.04 with only libssh-dev and pkg-config installed,
      # ./build.sh dies with "sh: 1: clang: not found" (measured in a
      # container). Naming it here means this job describes its own
      # dependencies instead of inheriting them from the runner image.
      - name: Install libssh (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssh-dev pkg-config clang

      - name: Install libssh (macOS)
        if: runner.os == 'macOS'
        run: brew install libssh pkg-config

      # Pinned, not `branch: master`. Odin's tagged releases are snapshots of
      # the same nightly line otsh needs for core:sys/posix, so pinning costs
      # nothing in coverage and buys a build that does not change under us.
      #
      # `token` is not optional here: setup-odin downloads release assets
      # through the GitHub API, and its README is explicit that a token must be
      # set to use releases at all. Omitting it makes every pinned job fail to
      # install a compiler.
      - name: Install Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: ${{ env.ODIN_RELEASE }}

      - name: Build packages and every example
        run: |
          ./build.sh
          for ex in examples/*/; do ./build.sh "$ex"; done

      # `otsh new` is the first command a new user runs, and the main.odin it
      # writes is Odin source embedded in a shell script — invisible to every
      # other check here. The examples would keep building happily while the
      # scaffold rotted against a changed tui/sshtui API, and the person who
      # found out would be someone trying otsh for the first time. So scaffold
      # a project outside the checkout and build it. One `odin build`, in the
      # job that already has the toolchain installed.
      - name: Scaffold a project and build it
        run: |
          ./otsh new "$RUNNER_TEMP/scaffold-probe"
          ./otsh build "$RUNNER_TEMP/scaffold-probe"

      - name: Run tests
        run: ./test.sh

      # Compares libssh/libssh.odin against the installed headers: callback
      # struct order, enum values, and every @(link_name) against the library's
      # exported symbols. Skips with exit 0 where the headers are absent. It
      # lives in this job rather than `docs` because only this one installs
      # libssh; in `docs` it would do nothing but skip.
      - name: Bindings match the installed libssh
        run: python3 docs/tools/check_bindings.py --check

      # The Windows job below is allowed to fail, so this is the only Windows
      # guarantee that actually gates a merge: the platform-split files still
      # type-check for windows_amd64. Type-checking needs no libssh and no
      # Windows runner, so it is cheap and it is trustworthy.
      - name: Cross-type-check every package and example for Windows
        if: runner.os == 'Linux'
        run: |
          for pkg in libssh ssh tui sshtui; do
            odin check "$pkg" -collection:otsh=. -target:windows_amd64 -no-entry-point
          done
          for ex in examples/*/; do
            odin check "$ex" -collection:otsh=. -target:windows_amd64
          done

      # FreeBSD is a claimed platform with no runner and no builds behind it,
      # which is how tui/local.odin's TIOCGWINSZ came to hold the Linux value
      # there. Type-checking is not running it, but it is the only automated
      # statement about FreeBSD that exists, and it is free.
      - name: Cross-type-check every package and example for FreeBSD
        if: runner.os == 'Linux'
        run: |
          for pkg in libssh ssh tui sshtui; do
            odin check "$pkg" -collection:otsh=. -target:freebsd_amd64 -no-entry-point
          done
          for ex in examples/*/; do
            odin check "$ex" -collection:otsh=. -target:freebsd_amd64
          done

      # The otsh tool (cmd/otsh) claims five targets and the release job below
      # builds four of them for real — but only on tags. This step is what
      # guards them on every push, the same way the loops above guard the
      # library: a type-check is not a run, but it catches the core:os and
      # core:sys drift that would otherwise wait for release day. The native
      # linux_amd64 build is already exercised by every ./build.sh step here,
      # because the ./otsh bootstrap compiles cmd/otsh on first use.
      - name: Cross-type-check the otsh tool for every claimed target
        if: runner.os == 'Linux'
        run: |
          for target in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64 windows_amd64 freebsd_amd64; do
            odin check cmd/otsh -target:"$target"
          done

  # The canary. Everything above builds against a pin, which is what keeps CI
  # honest — but a pin also means upstream could break otsh months before
  # anyone noticed, and the first person to find out would be a user upgrading
  # their compiler. So one job tracks Odin's master, and it is allowed to fail.
  #
  # Read it as a notification, not a gate: a red X here means "the next Odin
  # release will need work", and the work is to fix otsh and then move
  # ODIN_RELEASE. It never blocks a merge and it never runs on a push, so it
  # costs one 1x runner a week and nobody's time until it has something to say.
  #
  # `branch: master` with `release: false` is what the pinned jobs used to do;
  # it compiles Odin from source, which is why this is the one job that wants
  # its own LLVM and takes minutes rather than seconds.
  odin-master:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install libssh (Linux)
        run: sudo apt-get update && sudo apt-get install -y libssh-dev pkg-config clang

      - name: Install Odin (master, unpinned — this is the point)
        uses: laytan/setup-odin@v2
        with:
          release: false
          branch: master

      - name: Which compiler are we actually testing
        run: odin version

      - name: Build packages and every example
        run: |
          ./build.sh
          for ex in examples/*/; do ./build.sh "$ex"; done

      - name: Run tests
        run: ./test.sh

      # The cross-checks are part of the canary too: a core:sys/windows or
      # core:sys/freebsd change upstream shows up here first, and those are
      # platforms no runner in this file actually executes.
      - name: Cross-type-check every package and example for Windows
        run: |
          for pkg in libssh ssh tui sshtui; do
            odin check "$pkg" -collection:otsh=. -target:windows_amd64 -no-entry-point
          done
          for ex in examples/*/; do
            odin check "$ex" -collection:otsh=. -target:windows_amd64
          done

      - name: Cross-type-check every package and example for FreeBSD
        run: |
          for pkg in libssh ssh tui sshtui; do
            odin check "$pkg" -collection:otsh=. -target:freebsd_amd64 -no-entry-point
          done
          for ex in examples/*/; do
            odin check "$ex" -collection:otsh=. -target:freebsd_amd64
          done

  # macOS at 10x is the most expensive minute GitHub sells, and it is also the
  # platform this package is developed on, so a break here shows up on the
  # author's machine long before CI would tell them. Weekly, on demand, and for
  # release tags is enough; `if` rather than a separate workflow so the whole
  # matrix stays readable in one file.
  macos:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libssh (macOS)
        run: brew install libssh pkg-config

      - name: Install Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: ${{ env.ODIN_RELEASE }}

      - name: Build packages and every example
        run: |
          ./build.sh
          for ex in examples/*/; do ./build.sh "$ex"; done

      - name: Run tests
        run: ./test.sh

  # Windows is now genuinely exercised: on 2026-07-31 every step below was
  # reproduced by hand on a physical Windows 11 machine — vcpkg libssh 0.12.0,
  # Odin dev-2026-07a, ./build.sh for the packages and all five examples, and
  # ./test.sh (67 tests) under Git Bash, all green, with tracker.exe then
  # serving real openssh sessions. It found four genuine bugs on the way, which
  # is what this job is for.
  #
  # This job has since run on a hosted windows-latest runner — the first push
  # to GitHub, 2026-08-01, all four jobs green, this one in 17 minutes. So the
  # plumbing works too, on a machine that differs from that desktop in the ways
  # that matter: vcpkg preinstalled at C:\vcpkg rather than cloned, a different
  # Visual Studio edition.
  #
  # It still does not block, and the reason is now about evidence rather than
  # ignorance: one green run is not a track record. Windows is also the only
  # platform here whose failures would most likely be about the runner image —
  # a vcpkg or VS bump — rather than about otsh, and being unable to merge
  # because Microsoft changed an image is a bad trade for a package whose
  # Windows code is already cross-type-checked on every push by the Linux job.
  # Flip it to blocking after a few more green weekly runs.
  #
  # It is also the single most expensive job here — 17 minutes wall, almost all
  # of it vcpkg compiling libssh and OpenSSL from source, doubled to 34 billed
  # minutes. Hence the same gating as macOS, plus a binary cache below so a
  # repeat run restores the built package instead of rebuilding it.
  windows:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        # Git Bash, so build.sh and test.sh run unmodified. Their Windows
        # branch keys off `uname -s` reporting MINGW64.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # vcpkg's own binary cache, persisted between runs. Without it every run
      # recompiles libssh, OpenSSL and zlib — the bulk of this job's 17
      # minutes. The key is pinned to the vcpkg commit the runner image ships,
      # so a runner-image bump invalidates the cache rather than restoring
      # packages built against a different toolchain.
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ runner.os }}-libssh-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: vcpkg-${{ runner.os }}-libssh-

      # vcpkg is preinstalled on the windows runner image, at
      # $VCPKG_INSTALLATION_ROOT, which is where build.sh looks.
      - name: Install libssh (vcpkg)
        run: vcpkg install libssh:x64-windows

      - name: Install Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: ${{ env.ODIN_RELEASE }}

      # The linker finds ssh.lib through /LIBPATH:. There is no rpath on
      # Windows, so ssh.dll has to be on PATH for anything built here to start.
      - name: Put the libssh DLL on PATH
        run: echo "$VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" >> "$GITHUB_PATH"

      - name: Build packages and every example
        run: |
          ./build.sh
          for ex in examples/*/; do ./build.sh "$ex"; done

      - name: Run tests
        run: ./test.sh

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The generated API pages are committed, so a doc comment edited without
      # re-running the generator is a CI failure rather than silent drift.
      - name: API reference is up to date
        run: python3 docs/tools/gen_api.py --check

      # Validates links, images, unconverted Markdown and the sidebar.
      - name: Docs site builds and validates
        run: python3 docs/tools/build_site.py --check

  # Prebuilt binaries of the otsh TOOL (cmd/otsh) for every release tag. The
  # library stays source-only — -collection:otsh= points at a checkout and
  # nothing about that changes — but the tool is a program, and a program you
  # can download beats one you must first compile. Each binary is the tool
  # alone: it links against nothing but the OS (libssh is a dependency of the
  # apps it builds, not of the tool), so no runner here installs libssh.
  #
  # Four native runners rather than cross-compiles wherever a runner exists,
  # because a binary that ran `version` on its own platform is a claim and a
  # cross-compiled one is a prediction. The one exception is darwin-amd64,
  # cross-built and untested on the arm64 macOS runner — macos-13, the last
  # hosted Intel Mac, was retired — and labelled here so nobody mistakes it
  # for the others. Artifact names match what the ./otsh bootstrap looks for
  # in bin/, so a downloaded binary dropped there is used as-is.
  #
  # The release is created as a PRE-release with placeholder notes (0.x is
  # pre-release policy anyway — see docs/releasing.md); publishing is a human
  # editing in the changelog section afterwards. Created here rather than as
  # a draft because draft releases cannot be reliably resolved by tag name
  # for uploads, and four parallel jobs racing `gh release create` is safe
  # for a published release — the tag can hold only one, so the losers get a
  # clean 422 and move on to uploading.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: otsh-linux-amd64
          - os: ubuntu-24.04-arm
            artifact: otsh-linux-arm64
          - os: macos-latest
            artifact: otsh-darwin-arm64
            cross_target: darwin_amd64
            cross_artifact: otsh-darwin-amd64
          - os: windows-latest
            artifact: otsh-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    # The one job in this file that writes to the repository: it creates the
    # release and attaches assets. Scoped here, not at the top — every other
    # job keeps the read-only token.
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: ${{ env.ODIN_RELEASE }}

      - name: Build the tool
        run: |
          odin build cmd/otsh -out:${{ matrix.artifact }} -o:speed \
            -define:OTSH_TOOL_VERSION="${GITHUB_REF_NAME#v}"

      # `version` from inside the checkout exercises the checkout-resolution
      # walk and the version parse — the two things most likely to differ
      # between "it linked" and "it works".
      - name: Smoke-test the native binary
        run: |
          ./${{ matrix.artifact }} version
          mkdir -p bin && cp ${{ matrix.artifact }} bin/
          ./otsh version

      - name: Cross-build darwin-amd64 (unsmoked — no Intel runner exists)
        if: matrix.cross_target != ''
        run: odin build cmd/otsh -target:${{ matrix.cross_target }} -out:${{ matrix.cross_artifact }} -o:speed

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --prerelease \
              --title "otsh ${tag#v}" \
              --notes "Binaries below are the otsh command-line tool. Release notes: see the ${tag#v} section of CHANGELOG.md — docs/releasing.md step 7 replaces this placeholder." \
              || true
          gh release upload "$tag" "${{ matrix.artifact }}" --clobber
          if [ -n "${{ matrix.cross_artifact }}" ]; then
            gh release upload "$tag" "${{ matrix.cross_artifact }}" --clobber
          fi
